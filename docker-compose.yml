# Нэг серверт контейнераар (A4, NFR-7). Эхлүүлэх:  cp .env.example .env  &&  docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FC_OWNER_PASSWORD: ${FC_OWNER_PASSWORD}
      FC_APP_PASSWORD: ${FC_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forecast"]
      interval: 5s
      retries: 20

  migrate:            # схемийн эзэн (fc_owner) — нэг удаа ажиллаад гарна
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["python", "-m", "fcsys.migrate"]
    environment:
      OWNER_DATABASE_URL: postgresql://fc_owner:${FC_OWNER_PASSWORD}@db:5432/forecast
    depends_on: { db: { condition: service_healthy } }

  api:                # fc_app хэрэглэгч — trigger-ийг тойрох эрхгүй (§4.7)
    build: { context: ., dockerfile: backend/Dockerfile, args: { CODE_VERSION: "${CODE_VERSION:-dev}" } }
    restart: unless-stopped
    environment: &app_env
      DATABASE_URL: postgresql://fc_app:${FC_APP_PASSWORD}@db:5432/forecast
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CODE_VERSION: ${CODE_VERSION:-dev}
      BATCH_SIZE: ${BATCH_SIZE:-25}
    volumes: [filestore:/data/files]
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker:             # тооцоолол API-аас тусдаа процесс (A2); олшруулах: docker compose up -d --scale worker=3
    build: { context: ., dockerfile: backend/Dockerfile, args: { CODE_VERSION: "${CODE_VERSION:-dev}" } }
    command: ["python", "-m", "fcsys.engine.worker"]
    restart: unless-stopped
    environment: *app_env
    volumes: [filestore:/data/files]
    depends_on: { migrate: { condition: service_completed_successfully } }

  web:
    build: { context: ., dockerfile: frontend/Dockerfile }
    restart: unless-stopped
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on: [api]

volumes:
  pgdata:
  filestore:
